<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciro Accessibility Scanner Cloud</title><style>body{font:16px system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#172033}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}input{width:100%;box-sizing:border-box}label{display:block;margin:12px 0 6px}button{cursor:pointer;margin-top:16px}.card{border:1px solid #dbe3ef;border-radius:12px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fb;padding:12px;border-radius:8px}.muted{color:#667085}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Accessibility Scanner Cloud v0.7</h1><p class="muted">Netlify · WDC-013 · axe + Playwright + Chromium</p><div class="card"><label>API token</label><input id="token" type="password" autocomplete="off"><label>URL</label><input id="url" value="https://www.setik.biz/it/telecamere/1029-setik-dmdummy-telecamera-finta-dome-con-luce-ir-led-setik.html"><div class="grid"><div><label>Modalità</label><select id="mode"><option value="single_url">Singola URL</option><option value="crawl">Crawl sito</option></select></div><div><label>Max pagine crawl</label><input id="max" type="number" min="1" max="50" value="20"></div></div><label>External ref</label><input id="ref" value="test-wdc013-netlify"><button id="go">Avvia scansione</button></div><div class="card"><b>Stato:</b> <span id="status">pronto</span><pre id="out"></pre><div id="links"></div></div><script>
const $=id=>document.getElementById(id); $('token').value=sessionStorage.getItem('a11yToken')||'';
async function api(path,opt={}){const token=$('token').value.trim();sessionStorage.setItem('a11yToken',token);return fetch(path,{...opt,headers:{...(opt.headers||{}),'Authorization':'Bearer '+token}})}
$('go').onclick=async()=>{try{$('status').textContent='invio richiesta…';$('out').textContent='';$('links').innerHTML='';const r=await api('/api/v1/scans',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({external_ref:$('ref').value,project_name:'Dashboard cloud',url:$('url').value,mode:$('mode').value,max_pages:Number($('max').value)})});const j=await r.json();if(!r.ok)throw new Error(JSON.stringify(j));$('out').textContent=JSON.stringify(j,null,2);poll(j.job_id);}catch(e){$('status').textContent='errore';$('out').textContent=e.message}}
async function poll(id){for(let i=0;i<180;i++){await new Promise(r=>setTimeout(r,3000));const r=await api('/api/v1/jobs/'+id);const j=await r.json();$('status').textContent=j.status;$('out').textContent=JSON.stringify(j,null,2);if(j.status==='completed'){const a=j.result?.wdc013?.report_url,b=j.result?.wdc013?.report_pdf_url;$('links').innerHTML=`<p><a href="${a}" target="_blank">Apri report HTML</a> · <a href="${b}" target="_blank">Apri PDF</a></p>`;return}if(j.status==='failed')return}$('status').textContent='timeout polling UI'}
</script></body></html>
